version: '3.8'

# Local stack (service standard §9). The config defaults point here so `worker` + `local`
# run against it with no setup. Temporal is not in compose — run a dev server with the
# Temporal CLI:  temporal server start-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: maal_business_pg
    restart: unless-stopped
    ports: ["54322:5432"]
    environment:
      POSTGRES_USER: maaladmin
      POSTGRES_PASSWORD: maalpassword
      POSTGRES_DB: maalbizdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: maal_business_cloudbeaver
    restart: unless-stopped
    ports: ["8978:8978"]
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

volumes:
  pgdata:
  cloudbeaver_data:
